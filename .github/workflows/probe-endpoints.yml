name: Probe endpoints (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/probe_endpoints.py
      - run: |
          git config user.name "stock-alert-bot"; git config user.email "stock-alert-bot@users.noreply.github.com"
          git add -f probe && git commit -qm "Temporary probe output"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
