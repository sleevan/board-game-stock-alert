name: Debug store search
on:
  workflow_dispatch:
    inputs:
      query: { default: "Catan" }
      stores: { default: "" }
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/debug_search.py "${{ inputs.stores }}" | tee debug.txt
      - run: |
          git config user.name "stock-alert-bot"; git config user.email "stock-alert-bot@users.noreply.github.com"
          git checkout -b debug-out && git add -f debug.txt && git commit -qm debug && git push -qf origin debug-out
