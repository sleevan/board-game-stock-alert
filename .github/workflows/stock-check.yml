name: Board game stock check

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC); GitHub may delay runs a little
  workflow_dispatch:          # adds a "Run workflow" button for manual checks
    inputs:
      test_email:
        description: "Just send a test email (no stock check)"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job save state.json back to the repo

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check stock
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python stock_alert.py --test-email
          else
            python stock_alert.py
          fi
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'you@gmail.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'you@gmail.com' }}

      - name: Save state
        if: always()
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "stock-alert-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "Update stock state"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
