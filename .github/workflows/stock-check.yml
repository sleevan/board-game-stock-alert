name: Board game stock check

on:
  schedule:
    - cron: "13,43 * * * *"   # every 30 minutes, off the busy :00/:30 marks (GitHub may delay runs a little)
  workflow_dispatch:          # adds a "Run workflow" button for manual checks
    inputs:
      test_email:
        description: "Just send a test email (no stock check)"
        type: boolean
        default: false
      manual:
        description: "Run even if a check ran in the last 20 minutes"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job save results (and looked-up publishers) back to the repo

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check stock
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python stock_alert.py --test-email
          else
            python stock_alert.py
          fi
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Started from the web page / Actions tab = manual. Schedule and cron-job.org (which sends no inputs) = automatic.
          DEFER_EMAIL: "true"
          CHECK_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.manual == true }}

      - name: Save results
        id: save
        run: |
          git config user.name "stock-alert-bot"
          git config user.email "stock-alert-bot@users.noreply.github.com"
          # 1. results (state.json) - this check's results win any clash with an older save
          git add state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "Update stock results"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull -q --rebase -X theirs && git push -q; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
            [ -n "$ok" ] || { echo "Couldn't save results; no email sent this time (the next check will send it)."; exit 1; }
          fi
          # 2. publishers filled in (config.json) - never overwrite your own edits: skip on any clash
          git add config.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -qm "Fill in publishers"
            (git pull -q --rebase && git push -q) || { git rebase --abort 2>/dev/null; echo "Publisher update skipped this time"; }
          fi

      - name: Send alert email
        if: steps.save.outcome == 'success'
        run: python stock_alert.py --send-outbox
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
